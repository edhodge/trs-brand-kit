<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TRS Slider — TRS Golf</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  body{margin:0;background:#f3f3f3;color:#161616;font-family:'Aeonik','Suisse Intl',sans-serif}
  .frame{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;position:relative;overflow:hidden}
  .pdp-section{padding:20px 16px}
  .designer{font-size:12px;color:#5f5f5f;margin-top:4px;letter-spacing:-.01em}
  .lede{font-size:14px;color:#161616;margin-top:10px;line-height:1.55}
  h1.product{font-family:Aeonik;font-weight:500;font-size:28px;line-height:1;letter-spacing:-.02em;margin:8px 0 0}
  .label-row{font-size:13px;font-weight:500;color:#161616;display:flex;justify-content:space-between;align-items:center;margin:24px 0 8px}
  .help{font-size:13px;text-decoration:underline;color:rgba(0,0,0,.68);background:none;border:0;cursor:pointer}
  .stripe{background:#cf2437;color:#fff;padding:10px 16px;display:flex;gap:18px;overflow:hidden;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .stripe span{display:inline-flex;align-items:center;gap:6px}
  .star-mini{display:inline-block;width:6px;height:6px;background:#fff;clip-path:polygon(50% 0,61% 38%,100% 38%,68% 60%,79% 100%,50% 76%,21% 100%,32% 60%,0 38%,39% 38%)}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .stat{padding:14px 10px;border:1px solid #e4e4e4;text-align:center}
  .stat .n{font-family:Aeonik;font-weight:700;font-size:28px;color:#cf2437;letter-spacing:-.02em}
  .stat .l{font-size:11px;color:#5f5f5f;line-height:1.3;margin-top:4px}
  .pro-card{display:flex;gap:12px;align-items:center;padding:14px;background:#f7f7f7;border:1px solid #e4e4e4;margin-top:14px}
  .pro-card img{width:64px;height:64px;object-fit:cover;border-radius:9999px}
  .pro-card h4{margin:0;font-size:14px;font-weight:700}
  .pro-card p{margin:2px 0 0;font-size:12px;color:#5f5f5f;line-height:1.4}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#161616;color:#fff;padding:12px 18px;border-radius:2px;font-size:13px;font-weight:500;letter-spacing:-.01em;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:60;animation:up .2s ease}
  @keyframes up{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="ProductGallery.jsx"></script>
<script type="text/babel" src="ReviewBar.jsx"></script>
<script type="text/babel" src="TrustList.jsx"></script>
<script type="text/babel" src="PricingPacks.jsx"></script>
<script type="text/babel" src="VariantPicker.jsx"></script>
<script type="text/babel" src="BuyBox.jsx"></script>
<script type="text/babel" src="FAQ.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const {useState} = React;

const App = () => {
  const [imgIdx, setImgIdx] = useState(0);
  const [pack, setPack] = useState(2);
  const [size, setSize] = useState('Medium');
  const [added, setAdded] = useState(false);
  const [toast, setToast] = useState(null);

  const images = [
    '../../assets/figma_pdp_main.png',
    '../../assets/figma_pdp_secondary.png',
    '../../assets/figma_action.jpg',
    '../../assets/figma_pack.png',
  ];
  const prices = {1:{p:'£129.90', w:'£129.90'}, 2:{p:'£207.84', w:'£259.80'}, 3:{p:'£272.79', w:'£389.70'}};

  const handleAdd = () => {
    setAdded(true);
    setToast(`${pack} × TRS Slider (${size}) added`);
    setTimeout(()=>setAdded(false), 2200);
    setTimeout(()=>setToast(null), 2400);
  };

  return (
    <div className="frame" data-screen-label="01 PDP">
      <Header/>

      <ProductGallery images={images} idx={imgIdx} setIdx={setImgIdx}/>

      <div className="pdp-section" data-screen-label="01a Buy">
        <ReviewBar/>
        <h1 className="product">TRS Slider</h1>
        <div className="designer">Designed by <strong>Robert Rock</strong></div>
        <p className="lede">The viral training aid designed by Robert Rock that forces your swing path into the correct impact position.</p>
        <TrustList items={[
          'Proven to fix even the worst of slices',
          'Longer drives & more greens in regulation',
          'Improve accuracy & distance on your shots',
        ]}/>

        <div className="label-row" style={{marginTop:24}}>Bundle & save up to 30%</div>
        <PricingPacks selected={pack} onSelect={setPack}/>

        <div className="label-row">Choose your slider size</div>
        <VariantPicker label="" options={['Small','Medium','Large']} value={size} onChange={setSize}/>
        <button className="help" style={{marginTop:14}}>ⓘ  Will this work for a player off my handicap?</button>

        <BuyBox price={prices[pack].p} was={prices[pack].w} onAdd={handleAdd} added={added}/>
      </div>

      <div className="stripe" role="region" aria-label="Benefits">
        <span><span className="star-mini"/>Hit more greens in regulation</span>
        <span><span className="star-mini"/>Eliminate your slice forever</span>
        <span><span className="star-mini"/>Gain extra distance instantly</span>
      </div>

      <div className="pdp-section" data-screen-label="02 Numbers">
        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',color:'#5f5f5f'}}>The Numbers Behind Better Golf</div>
        <h2 style={{fontFamily:'Aeonik',fontWeight:500,fontSize:24,letterSpacing:'-.02em',margin:'8px 0 4px'}}>What golfers notice when they train with TRS</h2>
        <div className="stat-row">
          <div className="stat"><div className="n">82%</div><div className="l">reduced their slice within 7 days</div></div>
          <div className="stat"><div className="n">89%</div><div className="l">reached the power slot more often</div></div>
          <div className="stat"><div className="n">81%</div><div className="l">compressed the ball at impact</div></div>
        </div>

        <div className="pro-card">
          <img src="../../assets/figma_robert_rock.png" alt="Robert Rock"/>
          <div>
            <h4>Designed by Robert Rock</h4>
            <p>Built around one of the purest swings in the game, to help you find yours.</p>
          </div>
        </div>
      </div>

      <div className="pdp-section" data-screen-label="03 FAQ">
        <FAQ items={[
          {q:'What does the TRS Slider actually fix?', a:'It improves trail-arm connection and body rotation through the swing — for a more consistent impact position, better launch direction, and predictable ball flight.'},
          {q:'Why do tour players use the TRS Slider?', a:'To maintain connection, sequencing and consistency under pressure. It reinforces correct movement patterns without adding swing thoughts.'},
          {q:'Does it work for left-handed golfers?', a:'Yes. The TRS Slider works for both right- and left-handed golfers and can be adjusted accordingly.'},
          {q:'How long do I need to use it?', a:'Most golfers notice improved contact within a few sessions. For lasting change, use it regularly during practice over a few weeks.'},
          {q:'What if it doesn\u2019t improve my scores?', a:'It comes with a 60-day lower-score guarantee. If you don\u2019t see meaningful improvement, return it for a full refund.'},
        ]}/>
      </div>

      <Footer/>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
