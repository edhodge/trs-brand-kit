<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--trs-font-display);color:var(--trs-ink)}
.packs{display:flex;gap:8px}
.pack{flex:1;border:1px solid var(--trs-grey-300);border-radius:8px;padding:14px 12px;position:relative;background:#fff}
.pack.selected{border:2px solid var(--trs-red);background:var(--trs-red-tint);padding:13px 11px}
.pack .b{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--trs-red);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:9999px}
.pack .b.dk{background:var(--trs-ink)}
.pack img{width:100%;height:60px;object-fit:contain;background:#f3f3f3;margin-bottom:8px}
.pack .ph{width:100%;height:60px;background:#f3f3f3;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:#969696;font-size:11px}
.pack h4{font-size:14px;font-weight:700;margin:0 0 2px}
.pack p{font-size:11px;color:#5f5f5f;margin:0}
.pack .save{font-size:10px;color:var(--trs-red);font-weight:700;margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
</style></head><body>
<div class="packs">
  <div class="pack"><div class="ph">1 slider</div><h4>1 Slider</h4><p>£129.90 per slider</p></div>
  <div class="pack selected"><span class="b">Most Popular</span><div class="ph">2 sliders</div><h4>2 Sliders</h4><p>£103.92 per slider</p><div class="save">Save 20%</div></div>
  <div class="pack"><span class="b dk">Best Value</span><div class="ph">3 sliders</div><h4>3 Sliders</h4><p>£90.93 per slider</p><div class="save">Save 30%</div></div>
</div>
</body></html>
