<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--trs-font-display)}
.row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.swatch{width:130px;border:1px solid var(--trs-grey-300);border-radius:0;overflow:hidden;font-size:11px}
.chip{height:64px}
.meta{padding:8px 10px;line-height:1.35}
.name{font-weight:700;font-size:12px;color:var(--trs-ink)}
.hex{color:var(--trs-grey-700);font-family:var(--trs-font-mono);font-size:11px;letter-spacing:-0.01em}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#cf2437"></div><div class="meta"><div class="name">Brand Red</div><div class="hex">#cf2437</div></div></div>
  <div class="swatch"><div class="chip" style="background:#fc364c"></div><div class="meta"><div class="name">Red Bright</div><div class="hex">#fc364c</div></div></div>
  <div class="swatch"><div class="chip" style="background:#9c1827"></div><div class="meta"><div class="name">Red Dark</div><div class="hex">#9c1827</div></div></div>
  <div class="swatch"><div class="chip" style="background:#fff8f9;border-bottom:1px solid var(--trs-grey-300)"></div><div class="meta"><div class="name">Red Tint</div><div class="hex">#fff8f9</div></div></div>
</div>
</body></html>
