<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff}
.specimen{font-family:var(--trs-font-display);color:var(--trs-ink)}
.row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--trs-grey-300);padding:10px 0}
.label{font-family:var(--trs-font-mono);font-size:10px;color:var(--trs-grey-700);width:100px;flex:none}
.h1{font-size:28px;font-weight:500;letter-spacing:-0.02em;line-height:1}
.h2{font-size:24px;font-weight:500;letter-spacing:-0.02em;line-height:1}
.h3{font-size:20px;font-weight:500;letter-spacing:-0.02em;line-height:1}
.bigb{font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1}
</style></head><body>
<div class="specimen">
  <div class="row"><div class="label">Aeonik 700/32</div><div class="bigb">Tour-proven training.</div></div>
  <div class="row"><div class="label">Aeonik 500/28</div><div class="h1">No more guesswork.</div></div>
  <div class="row"><div class="label">Aeonik 500/24</div><div class="h2">The numbers behind better golf</div></div>
  <div class="row"><div class="label">Aeonik 500/20</div><div class="h3">Designed by Robert Rock</div></div>
</div>
</body></html>
