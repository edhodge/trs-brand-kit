<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--trs-font-display)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:140px;border:1px solid var(--trs-grey-300);font-size:11px}
.chip{height:60px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.meta{padding:8px 10px}
.name{font-weight:700;font-size:12px}
.hex{color:var(--trs-grey-700);font-family:var(--trs-font-mono);font-size:11px}
.use{font-size:10px;color:var(--trs-grey-700);margin-top:2px}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#5cd33f">●</div><div class="meta"><div class="name">Success</div><div class="hex">#5cd33f</div><div class="use">In stock</div></div></div>
  <div class="swatch"><div class="chip" style="background:#5794ee">i</div><div class="meta"><div class="name">Info</div><div class="hex">#5794ee</div><div class="use">Generic info</div></div></div>
  <div class="swatch"><div class="chip" style="background:#334fb4">B</div><div class="meta"><div class="name">Blue</div><div class="hex">#334fb4</div><div class="use">scheme-5</div></div></div>
  <div class="swatch"><div class="chip" style="background:#cf2437">!</div><div class="meta"><div class="name">Alert / CTA</div><div class="hex">#cf2437</div><div class="use">primary action</div></div></div>
</div>
</body></html>
