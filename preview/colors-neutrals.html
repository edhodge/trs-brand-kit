<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--trs-font-display)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:96px;border:1px solid var(--trs-grey-300);font-size:11px}
.chip{height:56px}
.meta{padding:6px 8px;line-height:1.3}
.name{font-weight:700;font-size:11px;color:var(--trs-ink)}
.hex{color:var(--trs-grey-700);font-family:var(--trs-font-mono);font-size:10px}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#161616"></div><div class="meta"><div class="name">Ink</div><div class="hex">#161616</div></div></div>
  <div class="swatch"><div class="chip" style="background:#222222"></div><div class="meta"><div class="name">Ink 2</div><div class="hex">#222222</div></div></div>
  <div class="swatch"><div class="chip" style="background:#5f5f5f"></div><div class="meta"><div class="name">Grey 700</div><div class="hex">#5f5f5f</div></div></div>
  <div class="swatch"><div class="chip" style="background:#969696"></div><div class="meta"><div class="name">Grey 600</div><div class="hex">#969696</div></div></div>
  <div class="swatch"><div class="chip" style="background:#e4e4e4"></div><div class="meta"><div class="name">Grey 300</div><div class="hex">#e4e4e4</div></div></div>
  <div class="swatch"><div class="chip" style="background:#f3f3f3"></div><div class="meta"><div class="name">Grey 100</div><div class="hex">#f3f3f3</div></div></div>
  <div class="swatch"><div class="chip" style="background:#f7f7f7"></div><div class="meta"><div class="name">Surface 2</div><div class="hex">#f7f7f7</div></div></div>
  <div class="swatch"><div class="chip" style="background:#ffffff;border-bottom:1px solid #e4e4e4"></div><div class="meta"><div class="name">Surface</div><div class="hex">#ffffff</div></div></div>
</div>
</body></html>
