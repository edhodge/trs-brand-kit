<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">

  <div class="col"><div class="box" style="height:40px"></div><div class="lbl">40</div></div>
  <div class="col"><div class="box" style="height:50px"></div><div class="lbl">50★</div></div>

</div>
<div style="margin-top:16px;font-size:11px;color:var(--trs-grey-700)">★ canonical section padding</div>
