<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--trs-font-display);color:var(--trs-ink)}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.demo{width:90px;height:54px;background:var(--trs-ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--trs-font-mono)}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.lbl{font-family:var(--trs-font-mono);font-size:10px;color:var(--trs-grey-700)}
</style></head><body>
<div class="row">
  <div class="col"><div class="demo" style="border-radius:0">0px</div><div class="lbl">default</div></div>
  <div class="col"><div class="demo" style="border-radius:2px">2px</div><div class="lbl">CTA</div></div>
  <div class="col"><div class="demo" style="border-radius:8px">8px</div><div class="lbl">cards</div></div>
  <div class="col"><div class="demo" style="border-radius:9999px">pill</div><div class="lbl">variant / badge</div></div>
</div>
</body></html>
