<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--trs-font-display);color:var(--trs-ink)}
.row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:13px}
img.tic{width:18px;height:18px}
</style></head><body>
<div class="row"><img src="../assets/Stock_Icon.svg" class="tic"><span class="lbl">Stock_Icon.svg — production stock indicator</span></div>
<div class="row"><img src="../assets/Ship_Icon.svg" class="tic"><span class="lbl">Ship_Icon.svg — production shipping mark</span></div>
<div class="row"><img src="../assets/star.svg" class="tic"><span class="lbl">star.svg — rating star (Figma export)</span></div>
<div class="row" style="border-top:1px dashed var(--trs-grey-300);padding-top:12px">
  <span style="font-family:var(--trs-font-mono);font-size:11px;color:var(--trs-grey-700)">Substitute → Lucide @ 1.5–2px stroke for general UI glyphs (cart, search, hamburger, chevrons)</span>
</div>
</body></html>
